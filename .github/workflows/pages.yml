name: Pages

on:
  push: { branches: [main], paths: ['site/**', 'docs/assets/**', 'docs/screenshots/**', 'packages/ui/**', '.github/workflows/pages.yml'] }
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:ui
      - name: Assemble the site
        run: |
          mkdir -p _site/ui
          cp site/*.html _site/
          cp -R docs/assets docs/screenshots _site/
          cp -R packages/ui/gallery/dist/. _site/ui/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
