name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:ext
      - run: npm run typecheck:ui
      - run: npx vitest run
      - run: npm run build
      - run: npm run build:ext
      - run: npm run build:ui

  extension-e2e:
    name: Chrome extension end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:ext
      - name: Install Chrome for Testing
        id: cft
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -n 1)
          echo "bin=${out#* }" >> "$GITHUB_OUTPUT"
      - name: Run the extension test
        run: xvfb-run -a env CHROME_BIN="${{ steps.cft.outputs.bin }}" CHROME_ARGS="--no-sandbox --disable-gpu" node packages/extension/tests/e2e.mjs

  desktop-smoke:
    name: Desktop app smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Run a few end-to-end scripts under a virtual display
        run: xvfb-run -a env ELECTRON_DISABLE_SANDBOX=1 python3 tests/e2e/suite.py hub sync ext threat permissions history bookmarks groups tracking sites notes netexport statepanel

  desktop-smoke-native:
    name: Desktop app smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm run build
      - name: Run self-contained end-to-end scripts
        run: python tests/e2e/suite.py hub sync ext threat permissions history bookmarks groups tracking sites notes netexport statepanel
