appId: dev.izlix.app
productName: Izlix
directories: { output: dist, buildResources: build }
files: ['out/**', 'package.json']
extraResources: [{ from: samples, to: samples }, { from: extension, to: extension }, { from: bin, to: bin }]
asar: true
afterPack: scripts/after-pack.cjs
protocols: [{ name: Izlix, schemes: [izlix] }]
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo: { NSCameraUsageDescription: '', NSMicrophoneUsageDescription: '' }
# Imzalama/notarization: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID ortam degiskenleriyle (CI).
# Yerel deneme: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --dir
publish: { provider: github }
