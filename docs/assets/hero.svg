<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Izlix: follow the trace from click to render">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17171a"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
      .title { font-size: 64px; font-weight: 700; letter-spacing: -2px; fill: #f4f4f5; }
      .tag { font-size: 22px; fill: #a1a1aa; }
      .lbl { font-size: 13px; letter-spacing: 2px; fill: #a1a1aa; }
      .node { fill: #1d1d20; stroke: #3f3f46; stroke-width: 2; }
      .dot { fill: #ff6a2b; }
      .trace { fill: none; stroke: #ff6a2b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 150; stroke-dashoffset: 150; }
      .n { opacity: 0; animation: pop 6s infinite; }
      .n1 { animation-delay: .2s } .n2 { animation-delay: 1.1s } .n3 { animation-delay: 2s } .n4 { animation-delay: 2.9s }
      .t { animation: draw 6s infinite; }
      .t1 { animation-delay: .6s } .t2 { animation-delay: 1.5s } .t3 { animation-delay: 2.4s }
      .pulse { transform-origin: 1010px 150px; animation: pulse 6s infinite; animation-delay: 3.2s; opacity: 0; }
      .cursor { animation: blink 1.1s steps(2) infinite; }
      @keyframes pop { 0% { opacity: 0; transform: translateY(8px) } 6%, 88% { opacity: 1; transform: none } 96%, 100% { opacity: 0; } }
      @keyframes draw { 0% { stroke-dashoffset: 150; opacity: 1 } 10%, 88% { stroke-dashoffset: 0; opacity: 1 } 96%, 100% { stroke-dashoffset: 0; opacity: 0 } }
      @keyframes pulse { 0% { opacity: 0; transform: scale(.4) } 10% { opacity: 1; transform: scale(1) } 30%, 100% { opacity: 0; transform: scale(1.5) } }
      @keyframes blink { to { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .n, .t, .pulse, .cursor { animation: none; opacity: 1; stroke-dashoffset: 0 } .pulse { opacity: 0 } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="64" y="150" class="title">Izlix<tspan class="cursor" fill="#ff6a2b">_</tspan></text>
  <text x="66" y="196" class="tag">Follow the trace, from click to render.</text>
  <text x="66" y="232" class="tag" style="font-size:17px">A React-aware development browser for macOS, Windows and Linux.</text>
  <text x="66" y="300" class="lbl mono">CAUSE · EFFECT · SOURCE</text>
  <circle class="pulse" cx="1010" cy="150" r="70" fill="url(#glow)"/>
  <g transform="translate(560 60)">
    <path class="trace t t1" d="M96 90 C140 90 130 90 170 90" transform="translate(0 0)"/>
    <path class="trace t t2" d="M266 90 C310 90 300 90 340 90"/>
    <path class="trace t t3" d="M436 90 C480 90 470 90 510 90"/>
    <g class="n n1"><rect class="node" x="0" y="50" width="96" height="80" rx="14"/><circle class="dot" cx="20" cy="72" r="5" style="fill:#a1a1aa"/><text x="34" y="77" class="lbl mono">INPUT</text><text x="16" y="112" class="mono" style="font-size:14px;fill:#e4e4e7">click</text></g>
    <g class="n n2"><rect class="node" x="170" y="50" width="96" height="80" rx="14"/><circle class="dot" cx="190" cy="72" r="5" style="fill:#fafafa"/><text x="204" y="77" class="lbl mono">REQ</text><text x="186" y="112" class="mono" style="font-size:14px;fill:#e4e4e7">GET /api</text></g>
    <g class="n n3"><rect class="node" x="340" y="50" width="96" height="80" rx="14"/><circle class="dot" cx="360" cy="72" r="5" style="fill:#a3e635"/><text x="374" y="77" class="lbl mono">RES</text><text x="356" y="112" class="mono" style="font-size:14px;fill:#e4e4e7">200 OK</text></g>
    <g class="n n4"><rect class="node" x="510" y="50" width="96" height="80" rx="14" style="stroke:#ff6a2b"/><circle class="dot" cx="530" cy="72" r="5" style="fill:#ffb454"/><text x="544" y="77" class="lbl mono">RENDER</text><text x="526" y="112" class="mono" style="font-size:14px;fill:#e4e4e7">App.tsx</text></g>
  </g>
</svg>
